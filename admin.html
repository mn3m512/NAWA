<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawa Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#F4F8FC;color:#0A1628;padding:20px;}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:10px;}
input:focus,select:focus{border-color:#4AA8E8;}
button{padding:10px 20px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.card{background:white;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px;}
.ok{color:#0D7A4A;background:rgba(29,185,122,.1);padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;margin-bottom:12px;display:block;}
.er{color:#B83030;background:rgba(232,74,74,.1);padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;margin-bottom:12px;display:block;}
.lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#0A1628;display:block;margin-bottom:4px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tab{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:white;color:#8A9BB5;}
.tab.on{background:#0A1628;color:white;}
.row{padding:12px 16px;border-bottom:1px solid #f0f4f8;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.row:nth-child(even){background:#fafcff;}
</style>
</head>
<body>

<div id="APP">
<div style="text-align:center;padding:60px;color:#8A9BB5;">Loading...</div>
</div>

<script>
// Wait for full page load
window.onload = function() {
  var APP = document.getElementById('APP');
  var TOKEN = '';
  var ALL_Q = [];
  var CUR_TAB = 'q';

  var SURL = 'https://zphhtwarzqhsmqsawknt.supabase.co';
  var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwaGh0d2FyenFoc21xc2F3a250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MTc0MzcsImV4cCI6MjA5MjQ5MzQzN30.n7fxZkwKtX_N_NoYHvzJvYSeUgb_9RYxcrPhZn8ciNY';

  // Try restore session
  try { TOKEN = localStorage.getItem('nawa_admin') || ''; } catch(e) {}

  if (TOKEN) {
    renderDash();
  } else {
    renderLogin();
  }

  // ── HELPERS ──
  function $(id) { return document.getElementById(id); }

  function setHTML(html) { APP.innerHTML = html; }

  async function req(method, path, body) {
    try {
      var h = {
        'Content-Type': 'application/json',
        'apikey': SKEY,
        'Authorization': 'Bearer ' + (TOKEN || SKEY),
        'Prefer': 'return=representation'
      };
      var opts = { method: method, headers: h };
      if (body) opts.body = JSON.stringify(body);
      var res = await fetch(SURL + path, opts);
      var txt = await res.text();
      var data;
      try { data = JSON.parse(txt); } catch(e) { data = txt; }
      return { ok: res.ok, status: res.status, data: data };
    } catch(e) {
      return { ok: false, data: e.message };
    }
  }

  // ── LOGIN ──
  function renderLogin() {
    setHTML(
      '<div style="max-width:360px;margin:60px auto;">' +
      '<div class="card" style="text-align:center;">' +
      '<div style="font-size:40px;margin-bottom:12px;">🔐</div>' +
      '<h2 style="font-size:20px;font-weight:800;margin-bottom:4px;">Nawa Admin</h2>' +
      '<p style="font-size:13px;color:#8A9BB5;margin-bottom:20px;">Admins only</p>' +
      '<div id="LM"></div>' +
      '<span class="lbl" style="text-align:left;">Email</span>' +
      '<input id="LE" type="email" placeholder="admin@email.com">' +
      '<span class="lbl" style="text-align:left;">Password</span>' +
      '<input id="LP" type="password" placeholder="Password" onkeydown="if(event.key===\'Enter\')window._login()">' +
      '<button onclick="window._login()" style="width:100%;background:#0A1628;color:white;margin-top:6px;">Sign In</button>' +
      '</div></div>'
    );
  }

  window._login = async function() {
    var email = $('LE') ? $('LE').value.trim() : '';
    var pw = $('LP') ? $('LP').value : '';
    var m = $('LM');
    if (!email || !pw) { if(m) m.innerHTML = '<span class="er">Enter email and password</span>'; return; }
    if(m) m.innerHTML = '<span style="color:#8A9BB5;font-size:12px;display:block;margin-bottom:8px;">Signing in...</span>';

    try {
      var res = await fetch(SURL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SKEY },
        body: JSON.stringify({ email: email, password: pw })
      });
      var data = await res.json();
      if (data.access_token) {
        TOKEN = data.access_token;
        try { localStorage.setItem('nawa_admin', TOKEN); } catch(e) {}
        renderDash();
      } else {
        var msg = data.error_description || data.msg || 'Wrong email or password';
        if(m) m.innerHTML = '<span class="er">' + msg + '</span>';
      }
    } catch(e) {
      if(m) m.innerHTML = '<span class="er">Network error: ' + e.message + '</span>';
    }
  };

  // ── DASHBOARD ──
  function renderDash() {
    setHTML(
      '<div style="background:#0A1628;margin:-20px -20px 20px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;">' +
      '<span style="color:white;font-size:15px;font-weight:700;">🎓 Nawa Admin</span>' +
      '<button onclick="window._logout()" style="background:rgba(255,255,255,.15);color:white;padding:6px 14px;font-size:12px;">Sign Out</button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">' +
      '<button class="tab on" id="t-q" onclick="window._tab(\'q\')">📋 Questions</button>' +
      '<button class="tab" id="t-add" onclick="window._tab(\'add\')">➕ Add</button>' +
      '<button class="tab" id="t-u" onclick="window._tab(\'u\')">👥 Users</button>' +
      '</div>' +
      '<div id="TC"></div>'
    );
    loadQ();
  }

  window._logout = function() {
    TOKEN = '';
    try { localStorage.removeItem('nawa_admin'); } catch(e) {}
    renderLogin();
  };

  window._tab = function(t) {
    CUR_TAB = t;
    ['q','add','u'].forEach(function(x) {
      var el = $(('t-' + x));
      if (el) { el.className = 'tab' + (x === t ? ' on' : ''); }
    });
    if (t === 'q') loadQ();
    else if (t === 'add') renderAdd();
    else if (t === 'u') loadU();
  };

  function tc() { return $('TC'); }

  // ── QUESTIONS ──
  async function loadQ() {
    var c = tc(); if (!c) return;
    c.innerHTML = '<p style="color:#8A9BB5;font-size:13px;">Loading...</p>';
    var r = await req('GET', '/rest/v1/questions?select=*&order=created_at.desc');
    if (r.ok) {
      ALL_Q = Array.isArray(r.data) ? r.data : [];
      renderQ(ALL_Q);
    } else {
      c.innerHTML = '<span class="er">Error: ' + JSON.stringify(r.data) + '</span>';
    }
  }

  function renderQ(data) {
    var c = tc(); if (!c) return;
    var h =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">' +
      '<b style="font-size:15px;">Questions (' + data.length + '/' + ALL_Q.length + ')</b>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<input id="QS" placeholder="Search..." style="width:150px;margin:0;" oninput="window._filterQ()">' +
      '<select id="QY" style="width:110px;margin:0;" onchange="window._filterQ()">' +
      '<option value="">All Years</option>' +
      '<option value="1">Year 1</option><option value="2">Year 2</option>' +
      '<option value="3">Year 3</option><option value="4">Year 4</option><option value="5">Year 5</option>' +
      '</select>' +
      '<button onclick="loadQ()" style="background:#E2EDF8;color:#0D3B7A;padding:8px 14px;font-size:12px;">↻</button>' +
      '</div></div>' +
      '<div id="QM"></div>';

    if (!data.length) {
      h += '<div class="card" style="text-align:center;color:#8A9BB5;padding:40px;">No questions. Add your first one!</div>';
    } else {
      h += '<div style="background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);">';
      for (var i = 0; i < data.length; i++) {
        var q = data[i];
        h += '<div class="row">' +
          '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
          q.question_text.substring(0,65) + (q.question_text.length > 65 ? '...' : '') + '</div>' +
          '<div style="font-size:11px;color:#8A9BB5;margin-top:2px;">' +
          (q.module_name||'—') + ' · Y' + (q.year_level||'?') + ' · <b style="color:#0D7A4A;">' + (q.correct_option||'?').toUpperCase() + '</b></div>' +
          '</div>' +
          '<div style="display:flex;gap:5px;flex-shrink:0;">' +
          '<button onclick="window._tog(\'' + q.id + '\',' + q.is_active + ')" style="padding:4px 9px;font-size:10px;font-weight:700;border:none;border-radius:6px;cursor:pointer;' +
          (q.is_active ? 'background:rgba(29,185,122,.1);color:#0D7A4A' : 'background:rgba(232,122,26,.1);color:#B85A0D') + ';">' +
          (q.is_active ? '✓' : '✗') + '</button>' +
          '<button onclick="window._del(\'' + q.id + '\')" style="padding:4px 9px;font-size:11px;border:none;border-radius:6px;cursor:pointer;background:rgba(232,74,74,.1);">🗑</button>' +
          '</div></div>';
      }
      h += '</div>';
    }
    c.innerHTML = h;
  }

  window._filterQ = function() {
    var s = ($('QS') ? $('QS').value : '').toLowerCase();
    var y = $('QY') ? $('QY').value : '';
    renderQ(ALL_Q.filter(function(q) {
      return (!s || (q.question_text||'').toLowerCase().includes(s) || (q.module_name||'').toLowerCase().includes(s)) &&
             (!y || q.year_level === y);
    }));
  };

  window._tog = async function(id, active) {
    await req('PATCH', '/rest/v1/questions?id=eq.' + id, { is_active: !active });
    loadQ();
  };

  window._del = async function(id) {
    if (!confirm('Delete this question?')) return;
    await req('DELETE', '/rest/v1/questions?id=eq.' + id);
    var m = $('QM');
    if (m) m.innerHTML = '<span class="ok">✅ Deleted</span>';
    setTimeout(loadQ, 700);
  };

  // ── ADD QUESTION ──
  function renderAdd() {
    var c = tc(); if (!c) return;
    c.innerHTML =
      '<div class="card" style="max-width:640px;">' +
      '<h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">➕ Add New Question</h3>' +
      '<div id="AM"></div>' +
      '<span class="lbl">Question Text *</span>' +
      '<textarea id="AQ" rows="3" placeholder="Which of the following..." style="resize:vertical;"></textarea>' +

```
  '<div class="g2">' +
  '<div><span class="lbl">Option A *</span><input id="AA" placeholder="Option A"></div>' +
  '<div><span class="lbl">Option B *</span><input id="AB" placeholder="Option B"></div>' +
  '<div><span class="lbl">Option C *</span><input id="AC" placeholder="Option C"></div>' +
  '<div><span class="lbl">Option D *</span><input id="AD" placeholder="Option D"></div>' +
  '</div>' +
  '<div class="g2">' +
  '<div><span class="lbl">Correct Answer *</span><select id="ACOR"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></div>' +
  '<div><span class="lbl">Difficulty</span><select id="ADIF"><option value="1">1 Easy</option><option value="2">2</option><option value="3" selected>3 Medium</option><option value="4">4</option><option value="5">5 Hard</option></select></div>' +
  '</div>' +
  '<span class="lbl">Explanation</span><input id="AEXP" placeholder="Why is this correct?">' +
  '<div class="g2">' +
  '<div><span class="lbl">Module Name</span><input id="AMOD" placeholder="MED431 Cardiopulmonary"></div>' +
  '<div><span class="lbl">Year Level</span><select id="AYEAR"><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4" selected>Year 4</option><option value="5">Year 5</option></select></div>' +
  '</div>' +
  '<div class="g2">' +
  '<div><span class="lbl">Subject/Block</span><input id="ABLK" placeholder="Cardiology"></div>' +
  '<div><span class="lbl">Bank</span><select id="ABNK"><option value="nawa">Nawa QBank</option><option value="final">Final QBank</option></select></div>' +
  '</div>' +
  '<button onclick="window._save()" style="background:#0A1628;color:white;margin-top:8px;">Save Question</button>' +
  '</div>';
```

}

window._save = async function() {
var q = $(‘AQ’) ? $(‘AQ’).value.trim() : ‘’;
var a = $(‘AA’) ? $(‘AA’).value.trim() : ‘’;
var b = $(‘AB’) ? $(‘AB’).value.trim() : ‘’;
var cc = $(‘AC’) ? $(‘AC’).value.trim() : ‘’;
var d = $(‘AD’) ? $(‘AD’).value.trim() : ‘’;
var m = $(‘AM’);
if (!q||!a||!b||!cc||!d) { if(m) m.innerHTML = ‘<span class="er">Fill all required fields (*)</span>’; return; }
if(m) m.innerHTML = ‘<span style="color:#8A9BB5;font-size:12px;display:block;margin-bottom:8px;">Saving…</span>’;
var r = await req(‘POST’, ‘/rest/v1/questions’, {
question_text: q, option_a: a, option_b: b, option_c: cc, option_d: d,
correct_option: $(‘ACOR’).value,
explanation: $(‘AEXP’) ? $(‘AEXP’).value.trim() : ‘’,
module_name: $(‘AMOD’) ? $(‘AMOD’).value.trim() : ‘’,
year_level: $(‘AYEAR’) ? $(‘AYEAR’).value : ‘4’,
block: $(‘ABLK’) ? $(‘ABLK’).value.trim() : ‘’,
bank: $(‘ABNK’) ? $(‘ABNK’).value : ‘nawa’,
difficulty: $(‘ADIF’) ? parseInt($(‘ADIF’).value) : 3,
is_active: true
});
if (!r.ok) {
if(m) m.innerHTML = ’<span class="er">Error: ’ + JSON.stringify(r.data) + ‘</span>’;
} else {
if(m) m.innerHTML = ‘<span class="ok">✅ Question saved!</span>’;
[‘AQ’,‘AA’,‘AB’,‘AC’,‘AD’,‘AEXP’,‘AMOD’,‘ABLK’].forEach(function(id) {
var el = $(id); if (el) el.value = ‘’;
});
}
};

// ── USERS ──
async function loadU() {
var c = tc(); if (!c) return;
c.innerHTML = ‘<p style="color:#8A9BB5;font-size:13px;">Loading…</p>’;
var r = await req(‘GET’, ‘/rest/v1/profiles?select=*&order=created_at.desc’);
if (!r.ok) { c.innerHTML = ‘<span class="er">Error: ’ + JSON.stringify(r.data) + ‘</span>’; return; }
var users = Array.isArray(r.data) ? r.data : [];
var h = ‘<b style="font-size:15px;display:block;margin-bottom:14px;">Students (’ + users.length + ‘)</b>’;
if (!users.length) {
h += ‘<div class="card" style="text-align:center;color:#8A9BB5;padding:40px;">No users yet</div>’;
} else {
h += ‘<div style="background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);">’;
for (var i = 0; i < users.length; i++) {
var u = users[i];
h += ‘<div class="row">’ +
‘<div>’ +
‘<div style="font-size:13px;font-weight:600;">’ + (u.first_name||’’) + ’ ’ + (u.last_name||’’) + ‘</div>’ +
‘<div style="font-size:11px;color:#8A9BB5;">’ + (u.email||’’) + ’ · ’ + (u.university||’—’) + ’ · Y’ + (u.year||’?’) + ‘</div>’ +
‘</div>’ +
‘<select onchange="window._plan(\'' + u.id + '\',this.value)" style="width:auto;margin:0;padding:6px 10px;">’ +
‘<option value=“basic”’ + (u.plan===‘basic’?’ selected’:’’) + ‘>Basic</option>’ +
‘<option value=“pro”’ + (u.plan===‘pro’?’ selected’:’’) + ‘>Pro</option>’ +
‘<option value=“elite”’ + (u.plan===‘elite’?’ selected’:’’) + ‘>Elite</option>’ +
‘</select></div>’;
}
h += ‘</div>’;
}
c.innerHTML = h;
}

window._plan = async function(id, plan) {
await req(‘PATCH’, ‘/rest/v1/profiles?id=eq.’ + id, { plan: plan });
};
};
</script>

</body>
</html>
