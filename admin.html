<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawa Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#F4F8FC;color:#0A1628;}
.inp{width:100%;padding:11px 13px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none;}
.inp:focus{border-color:#4AA8E8;}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.card{background:white;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;}
.tab{padding:9px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#8A9BB5;}
.tab.active{background:#0A1628;color:white;}
label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#0A1628;display:block;margin-bottom:5px;margin-top:12px;}
.ok{color:#0D7A4A;font-size:12px;padding:8px 12px;background:rgba(29,185,122,.08);border-radius:7px;margin-bottom:12px;}
.err{color:#B83030;font-size:12px;padding:8px 12px;background:rgba(232,74,74,.08);border-radius:7px;margin-bottom:12px;}
</style>
</head>
<body>
<div id="ROOT" style="padding:20px;min-height:100vh;">
  <div style="text-align:center;padding:80px;color:#8A9BB5;font-size:14px;">Loading...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js" onload="INIT()" onerror="document.getElementById('ROOT').innerHTML='<div style=color:red;padding:40px;text-align:center>Failed to load. Check internet connection.</div>'"></script>

<script>
var SB, ROOT;

function INIT() {
  try {
    SB = supabase.createClient(
      'https://zphhtwarzqhsmqsawknt.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwaGh0d2FyenFoc21xc2F3a250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MTc0MzcsImV4cCI6MjA5MjQ5MzQzN30.n7fxZkwKtX_N_NoYHvzJvYSeUgb_9RYxcrPhZn8ciNY'
    );
    ROOT = document.getElementById('ROOT');
    SB.auth.getSession().then(function(r) {
      if (r.data && r.data.session) DASH(r.data.session.user);
      else LOGIN();

    document.getElementById('ROOT').innerHTML = '<div style="color:red;padding:40px;text-align:center;">Error: ' + e.message + '</div>';

/* ── LOGIN ── */
function LOGIN() {
  ROOT.innerHTML =
    '<div style="max-width:360px;margin:80px auto;"><div class="card" style="text-align:center;">' +
    '<div style="font-size:36px;margin-bottom:12px;">🔐</div>' +
    '<h2 style="font-size:20px;font-weight:800;margin-bottom:4px;">Nawa Admin</h2>' +
    '<p style="font-size:13px;color:#8A9BB5;margin-bottom:20px;">Admins only</p>' +
    '<div id="LM"></div>' +
    '<label>Email</label><input class="inp" id="LE" type="email" placeholder="admin@email.com" style="margin-bottom:4px;">' +
    '<label>Password</label><input class="inp" id="LP" type="password" placeholder="Password" style="margin-bottom:16px;" onkeydown="if(event.key===\'Enter\')DO_LOGIN()">' +
    '<button class="btn" onclick="DO_LOGIN()" style="width:100%;background:#0A1628;color:white;">Sign In</button>' +
    '</div></div>';
}

async function DO_LOGIN() {
  var e = document.getElementById('LE').value.trim();
  var p = document.getElementById('LP').value;
  var m = document.getElementById('LM');
  if (!e || !p) { m.innerHTML = '<div class="err">Enter email and password</div>'; return; }
  m.innerHTML = '<div style="font-size:12px;color:#8A9BB5;margin-bottom:8px;">Signing in...</div>';
  var r = await SB.auth.signInWithPassword({ email: e, password: p });
  if (r.error) { m.innerHTML = '<div class="err">' + r.error.message + '</div>'; }
  else DASH(r.data.user);
}

/* ── DASHBOARD ── */
var ALL_Q = [];
var CUR_TAB = 'q';

function DASH(user) {
  ROOT.innerHTML =
    '<div style="background:#0A1628;margin:-20px -20px 20px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;">' +
    '<span style="color:white;font-size:15px;font-weight:700;">🎓 Nawa Admin</span>' +
    '<div style="display:flex;align-items:center;gap:10px;">' +
    '<span style="color:rgba(255,255,255,.45);font-size:11px;">' + (user.email||'') + '</span>' +
    '<button class="btn" onclick="DO_LOGOUT()" style="background:rgba(255,255,255,.1);color:white;padding:6px 12px;font-size:11px;">Sign Out</button>' +
    '</div></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">' +
    '<button class="tab active" id="tb-q" onclick="TAB(\'q\')">📋 Questions</button>' +
    '<button class="tab" id="tb-add" onclick="TAB(\'add\')">➕ Add Question</button>' +
    '<button class="tab" id="tb-u" onclick="TAB(\'u\')">👥 Users</button>' +
    '</div>' +
    '<div id="TC"></div>';
  LOAD_Q();
}

async function DO_LOGOUT() { await SB.auth.signOut(); LOGIN(); }

function TAB(t) {
  CUR_TAB = t;
  ['q','add','u'].forEach(function(x) {
    var el = document.getElementById('tb-' + x);
    if (el) el.className = 'tab' + (x === t ? ' active' : '');
  });
  if (t === 'q') LOAD_Q();
  else if (t === 'add') FORM_ADD();
  else if (t === 'u') LOAD_U();
}

/* ── QUESTIONS ── */
async function LOAD_Q() {
  var c = document.getElementById('TC'); if (!c) return;
  c.innerHTML = '<div style="color:#8A9BB5;font-size:13px;">Loading...</div>';
  var r = await SB.from('questions').select('*').order('created_at', {ascending:false});
  ALL_Q = r.data || [];
  RENDER_Q(ALL_Q);
}

function RENDER_Q(data) {
  var c = document.getElementById('TC'); if (!c) return;
  var h =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">' +
    '<div style="font-size:16px;font-weight:700;">Questions (' + data.length + ' / ' + ALL_Q.length + ' total)</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
    '<input class="inp" id="QS" placeholder="Search..." style="width:160px;" oninput="FILTER_Q()">' +
    '<select id="QY" class="inp" style="width:110px;" onchange="FILTER_Q()">' +
    '<option value="">All Years</option><option value="1">Year 1</option><option value="2">Year 2</option>' +
    '<option value="3">Year 3</option><option value="4">Year 4</option><option value="5">Year 5</option>' +
    '</select></div></div>' +
    '<div id="QM" style="margin-bottom:8px;"></div>' +
    '<div style="background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);">';
  if (!data.length) {
    h += '<div style="text-align:center;padding:30px;color:#8A9BB5;">No questions. Add your first one!</div>';
  } else {
    h += data.map(function(q, i) {
      return '<div style="padding:12px 16px;border-bottom:1px solid #f0f4f8;display:flex;justify-content:space-between;align-items:center;gap:10px;' + (i%2?'background:#fafcff':'') + '">' +
        '<div style="flex:1;min-width:0;">' +
        '<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + q.question_text.substring(0,65) + (q.question_text.length>65?'...':'') + '</div>' +
        '<div style="font-size:11px;color:#8A9BB5;margin-top:2px;">' + (q.module_name||'—') + ' · Y' + (q.year_level||'?') + ' · <strong style="color:#0D7A4A;">' + (q.correct_option||'?').toUpperCase() + '</strong> · ' + (q.bank||'nawa') + '</div>' +
        '</div><div style="display:flex;gap:5px;flex-shrink:0;">' +
        '<button class="btn" style="font-size:10px;padding:4px 9px;background:' + (q.is_active?'rgba(29,185,122,.1)':'rgba(232,122,26,.1)') + ';color:' + (q.is_active?'#0D7A4A':'#B85A0D') + ';" onclick="TOG_Q(\'' + q.id + '\',' + q.is_active + ')">' + (q.is_active?'Active':'Inactive') + '</button>' +
        '<button class="btn" style="font-size:10px;padding:4px 9px;background:rgba(232,74,74,.1);color:#B83030;" onclick="DEL_Q(\'' + q.id + '\')">🗑</button>' +
        '</div></div>';
    }).join('');
  }
  h += '</div>';
  c.innerHTML = h;
}

function FILTER_Q() {
  var s = (document.getElementById('QS').value||'').toLowerCase();
  var y = document.getElementById('QY').value;
  RENDER_Q(ALL_Q.filter(function(q) {
    return (!s || (q.question_text||'').toLowerCase().includes(s) || (q.module_name||'').toLowerCase().includes(s)) &&
           (!y || q.year_level === y);
  }));
}

async function TOG_Q(id, active) {
  await SB.from('questions').update({is_active: !active}).eq('id', id);
  LOAD_Q();
}

async function DEL_Q(id) {
  if (!confirm('Delete this question?')) return;
  await SB.from('questions').delete().eq('id', id);
  var m = document.getElementById('QM');
  if (m) m.innerHTML = '<div class="ok">✅ Deleted</div>';
  setTimeout(LOAD_Q, 700);
}

/* ── ADD QUESTION ── */

  var c = document.getElementById('TC'); if (!c) return;

    '<label>Question Text *</label>' +

}

async function SAVE_Q() {
var q=document.getElementById(‘AQ’).value.trim();
var a=document.getElementById(‘AA’).value.trim();
var b=document.getElementById(‘AB’).value.trim();
var cc=document.getElementById(‘AC’).value.trim();
var d=document.getElementById(‘AD’).value.trim();
var m=document.getElementById(‘AM’);
if(!q||!a||!b||!cc||!d){m.innerHTML=’<div class="err">Fill all required fields (*)</div>’;return;}
m.innerHTML=’<div style="font-size:12px;color:#8A9BB5;">Saving…</div>’;
var r=await SB.from(‘questions’).insert({
question_text:q,option_a:a,option_b:b,option_c:cc,option_d:d,
correct_option:document.getElementById(‘ACOR’).value,
explanation:document.getElementById(‘AEXP’).value.trim(),
module_name:document.getElementById(‘AMOD’).value.trim(),
year_level:document.getElementById(‘AYEAR’).value,
block:document.getElementById(‘ABLK’).value.trim(),
bank:document.getElementById(‘ABNK’).value,
difficulty:parseInt(document.getElementById(‘ADIF’).value),
is_active:true
});
if(r.error){m.innerHTML=’<div class="err">Error: ‘+r.error.message+’</div>’;}
else{
m.innerHTML=’<div class="ok">✅ Question saved!</div>’;
[‘AQ’,‘AA’,‘AB’,‘AC’,‘AD’,‘AEXP’,‘AMOD’,‘ABLK’].forEach(function(id){var el=document.getElementById(id);if(el)el.value=’’;});
}
}

/* ── USERS ── */
async function LOAD_U() {
var c=document.getElementById(‘TC’);if(!c)return;
c.innerHTML=’<div style="color:#8A9BB5;font-size:13px;">Loading…</div>’;
var r=await SB.from(‘profiles’).select(’*’).order(‘created_at’,{ascending:false});
var users=r.data||[];
var h=’<div style="font-size:16px;font-weight:700;margin-bottom:14px;">Students (’+users.length+’)</div>’ +
‘<div style="background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);">’;
if(!users.length){
h+=’<div style="text-align:center;padding:30px;color:#8A9BB5;">No users yet</div>’;
} else {
h+=users.map(function(u,i){
return ‘<div style="padding:12px 16px;border-bottom:1px solid #f0f4f8;display:flex;justify-content:space-between;align-items:center;'+(i%2?'background:#fafcff':'')+'">’ +
‘<div>’ +
‘<div style="font-size:13px;font-weight:600;">’+(u.first_name||’’)+’ ‘+(u.last_name||’’)+’</div>’ +
‘<div style="font-size:11px;color:#8A9BB5;">’+(u.email||’’)+’·’+(u.university||’—’)+’·Y’+(u.year||’?’)+’</div>’ +
‘</div>’ +
‘<select onchange="UPD_PLAN(\''+u.id+'\',this.value)" style="padding:6px 10px;border-radius:7px;border:1px solid #ddd;font-size:12px;">’ +
‘<option value=“basic”’+(u.plan===‘basic’?’ selected’:’’)+’>Basic</option>’ +
‘<option value=“pro”’+(u.plan===‘pro’?’ selected’:’’)+’>Pro</option>’ +
‘<option value=“elite”’+(u.plan===‘elite’?’ selected’:’’)+’>Elite</option>’ +
‘</select></div>’;
}).join(’’);
}
h+=’</div>’;
c.innerHTML=h;
}

async function UPD_PLAN(id,plan){await SB.from(‘profiles’).update({plan:plan}).eq(‘id’,id);}
</script>
