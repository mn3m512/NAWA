<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',-apple-system,sans-serif;background:#F4F8FC;color:#0A1628;}
nav{background:#0A1628;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:10px;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:#0A1628;display:flex;align-items:center;justify-content:center;z-index:200;}
.login-box{background:white;border-radius:20px;padding:36px;width:100%;max-width:380px;text-align:center;}
.login-title{font-size:20px;font-weight:800;color:#0A1628;margin-bottom:4px;}
.login-sub{font-size:12px;color:#8A9BB5;margin-bottom:24px;}
.form-inp{width:100%;padding:11px 14px;border:1.5px solid rgba(10,22,40,.12);border-radius:10px;font-family:inherit;font-size:13px;color:#0A1628;outline:none;margin-bottom:12px;}
.form-inp:focus{border-color:#4AA8E8;}
.btn-primary{width:100%;padding:12px;background:#0A1628;color:white;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.err-msg{color:#B83030;font-size:11px;margin-bottom:10px;}

/* LAYOUT */
main{margin-top:56px;display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:200px;background:white;border-right:1px solid rgba(10,22,40,.06);padding:20px 0;position:fixed;top:56px;left:0;bottom:0;overflow-y:auto;}
.s-item{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;font-weight:600;color:#8A9BB5;cursor:pointer;transition:all .2s;}
.s-item:hover{background:#F4F8FC;color:#0A1628;}
.s-item.active{background:#E2EDF8;color:#0D3B7A;border-right:3px solid #4AA8E8;}
.s-label{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#8A9BB5;padding:14px 16px 6px;}
.content{margin-left:200px;flex:1;padding:24px;}

/* CARDS */
.card{background:white;border-radius:14px;box-shadow:0 2px 12px rgba(10,22,40,.06);border:1px solid rgba(10,22,40,.04);margin-bottom:20px;overflow:hidden;}
.card-hd{padding:16px 20px;border-bottom:1px solid rgba(10,22,40,.05);display:flex;justify-content:space-between;align-items:center;}
.card-title{font-size:14px;font-weight:700;color:#0A1628;}
.card-body{padding:20px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(10,22,40,.05);position:relative;overflow:hidden;}
.stat-box::after{content:’’;position:absolute;top:0;left:0;right:0;height:3px;}
.stat-box.blue::after{background:linear-gradient(to right,#0D3B7A,#4AA8E8);}
.stat-box.green::after{background:linear-gradient(to right,#0D7A4A,#1DB97A);}
.stat-box.orange::after{background:linear-gradient(to right,#B85A0D,#E87A1A);}
.stat-box.red::after{background:linear-gradient(to right,#B83030,#E84A4A);}
.stat-val{font-size:28px;font-weight:800;color:#0A1628;letter-spacing:-1px;}
.stat-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8A9BB5;margin-top:4px;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#8A9BB5;padding:10px 14px;text-align:left;border-bottom:1px solid rgba(10,22,40,.06);background:#F4F8FC;}

.badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:100px;}
.badge-green{background:rgba(29,185,122,.1);color:#0D7A4A;}
.badge-orange{background:rgba(232,122,26,.1);color:#B85A0D;}

var parsedQuestions = [];

function handleDrop(e){
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag');
  var file = e.dataTransfer.files[0];
  if(file && file.type==='application/pdf') handlePDFUpload(file);
}

async function handlePDFUpload(file){
  if(!file) return;
  var msg = document.getElementById('upload-msg');
  msg.innerHTML='<div class="msg-box msg-info">⏳ Reading PDF... Please wait.</div>';
  
  try {
    var text = await extractTextFromPDF(file);
    parsedQuestions = parsePDFQuestions(text);
    
    var module = document.getElementById('pdf-module').value || file.name.replace('.pdf','');
    var year = document.getElementById('pdf-year').value;
    var block = document.getElementById('pdf-block').value;
    var bank = document.getElementById('pdf-bank').value;
    
    parsedQuestions = parsedQuestions.map(q=>({...q, module_name: module || q.module_name, year_level: year, block: block, bank: bank}));
    
    if(parsedQuestions.length === 0){
      msg.innerHTML='<div class="msg-box msg-error">❌ No questions found. Make sure PDF has Q1, A., B., C., D. format.</div>';
      return;
    }
    
    msg.innerHTML=`<div class="msg-box msg-success">✅ Found ${parsedQuestions.length} questions! Review below and click "Import All".</div>`;
    showPreview(parsedQuestions);
  } catch(err) {
    msg.innerHTML='<div class="msg-box msg-error">❌ Error reading PDF: ' + err.message + '</div>';
  }
}

// Simple PDF text extractor using FileReader
async function extractTextFromPDF(file){
  return new Promise((resolve, reject) => {
    var reader = new FileReader();
    reader.onload = function(e){
      // We'll use a simple text extraction approach
      var arrayBuffer = e.target.result;
      var uint8 = new Uint8Array(arrayBuffer);
      var text = '';
      // Extract readable text from PDF binary
      for(var i=0; i<uint8.length-1; i++){
        var c = uint8[i];
        if(c >= 32 && c <= 126) text += String.fromCharCode(c);
        else if(c === 10 || c === 13) text += '\n';
      }
      resolve(text);
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parsePDFQuestions(text){
  var questions = [];
  
  // Clean text - extract readable portions
  // Pattern: Q followed by number, then question text, then A. B. C. D. options
  var qPattern = /Q(\d+)\s*[\r\n]+([\s\S]*?)[\r\n]+A[.\)]\s*([\s\S]*?)[\r\n]+B[.\)]\s*([\s\S]*?)[\r\n]+C[.\)]\s*([\s\S]*?)[\r\n]+D[.\)]\s*([\s\S]*?)(?=[\r\n]+Q\d+|[\r\n]+Answers|$)/g;
  
  var match;
  while((match = qPattern.exec(text)) !== null){
    var qtext = match[2].trim().replace(/[\r\n]+/g,' ');
    var optA = match[3].trim().replace(/[\r\n]+/g,' ').split(/[\r\n]/)[0];
    var optB = match[4].trim().replace(/[\r\n]+/g,' ').split(/[\r\n]/)[0];
    var optC = match[5].trim().replace(/[\r\n]+/g,' ').split(/[\r\n]/)[0];
    var optD = match[6].trim().replace(/[\r\n]+/g,' ').split(/[\r\n]/)[0];
    
    // Remove trailing numbers (page numbers)
    optD = optD.replace(/\s*\d+\s*$/, '').trim();
    
    if(qtext.length > 10 && optA && optB && optC && optD){
      questions.push({
        question_text: qtext,
        option_a: optA,
        option_b: optB,
        option_c: optC,
        option_d: optD,
        correct_option: '',
        explanation: '',
        module_name: '',
        year_level: '1',
        block: '',
        bank: 'nawa',
        difficulty: 3,
        is_active: true
      });
    }
  }
  
  // Try to match answers
  var ansPattern = /(\d+)\s*\n\s*([A-D])\s*\n\s*([^\n]+)/g;
  var ansMatch;
  var answers = {};
  while((ansMatch = ansPattern.exec(text)) !== null){
    answers[parseInt(ansMatch[1])] = {
      letter: ansMatch[2].toLowerCase(),
      explanation: ansMatch[3].trim()
    };
  }
  
  questions.forEach((q, i) => {
    var ans = answers[i+1];
    if(ans){ q.correct_option = ans.letter; q.explanation = ans.explanation; }
  });
  
  return questions;
}

function showPreview(qs){
  document.getElementById('preview-section').style.display='block';
  document.getElementById('preview-count').textContent = qs.length + ' questions found';
  
  var html = '';
  var show = Math.min(qs.length, 10);
  for(var i=0; i<show; i++){
    var q = qs[i];
    html += `<div class="preview-q">
      <div class="preview-q-text">Q${i+1}. ${q.question_text.substring(0,100)}${q.question_text.length>100?'...':''}</div>
      <div class="preview-opts">

        <div class="preview-opt ${q.correct_option==='b'?'correct':''}">B. ${q.option_b.substring(0,50)}</div>
        <div class="preview-opt ${q.correct_option==='c'?'correct':''}">C. ${q.option_c.substring(0,50)}</div>

      </div>

    </div>`;
  }
  if(qs.length > 10) html += `<div style="text-align:center;padding:14px;font-size:12px;color:#8A9BB5;">... and ${qs.length-10} more questions</div>`;
  
  document.getElementById('preview-list').innerHTML = html;
  document.getElementById('import-progress').style.width='0%';
}

async function importQuestions(){
  if(!parsedQuestions.length) return;
  var btn = document.getElementById('import-btn');
  btn.textContent = 'Importing...'; btn.disabled = true;
  
  var batchSize = 50;
  var total = parsedQuestions.length;
  var imported = 0;
  
  for(var i=0; i<total; i+=batchSize){
    var batch = parsedQuestions.slice(i, i+batchSize);
    var res = await sb.from('questions').insert(batch);
    if(res.error){
      document.getElementById('upload-msg').innerHTML='<div class="msg-box msg-error">❌ Error: '+res.error.message+'</div>';
      btn.textContent='✅ Import All'; btn.disabled=false;
      return;
    }
    imported += batch.length;
    var pct = Math.round((imported/total)*100);
    document.getElementById('import-progress').style.width = pct+'%';
  }
  
  document.getElementById('upload-msg').innerHTML=`<div class="msg-box msg-success">🎉 Successfully imported ${imported} questions!</div>`;
  btn.textContent='✅ Import All'; btn.disabled=false;
}

async function saveQuestion(){
var text = document.getElementById(‘q-text’).value.trim();
var a = document.getElementById(‘q-a’).value.trim();
var b = document.getElementById(‘q-b’).value.trim();
var c = document.getElementById(‘q-c’).value.trim();
var d = document.getElementById(‘q-d’).value.trim();

if(!text||!a||!b||!c||!d){msg.innerHTML=’<div class="msg-box msg-error">Please fill all required fields</div>’;return;}

question_text: text,
option_a: a, option_b: b, option_c: c, option_d: d,
correct_option: document.getElementById(‘q-correct’).value,
explanation: document.getElementById(‘q-exp’).value.trim(),

year_level: document.getElementById(‘q-year’).value,

});

msg.innerHTML=’<div class="msg-box msg-success">✅ Question saved successfully!</div>’;
[‘q-text’,‘q-a’,‘q-b’,‘q-c’,‘q-d’,‘q-exp’,‘q-module’,‘q-block’].forEach(id=>{document.getElementById(id).value=’’;});
}
}

var allQuestions = [];
var currentPage = 0;
var pageSize = 20;

async function renderManage(c){
c.innerHTML=`<div style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;"> <div><div style="font-size:20px;font-weight:800;color:#0A1628;">📋 Manage Questions</div><div style="font-size:12px;color:#8A9BB5;margin-top:3px;">View, edit, and delete questions</div></div> </div> <div class="card"> <div class="card-hd"> <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;"> <input id="search-q" placeholder="🔍 Search questions..." style="padding:8px 12px;border:1.5px solid rgba(10,22,40,.1);border-radius:9px;font-family:inherit;font-size:12px;width:200px;outline:none;" oninput="filterQuestions()"> <select id="filter-year" style="padding:8px 12px;border:1.5px solid rgba(10,22,40,.1);border-radius:9px;font-family:inherit;font-size:12px;outline:none;appearance:none;" onchange="filterQuestions()"> <option value="">All Years</option> <option value="1">Year 1</option><option value="2">Year 2</option> <option value="3">Year 3</option><option value="4">Year 4</option><option value="5">Year 5</option> </select> <select id="filter-bank" style="padding:8px 12px;border:1.5px solid rgba(10,22,40,.1);border-radius:9px;font-family:inherit;font-size:12px;outline:none;appearance:none;" onchange="filterQuestions()"> <option value="">All Banks</option> <option value="nawa">Nawa QBank</option> <option value="final">Final QBank</option> </select> </div> <span id="q-count" style="font-size:12px;color:#8A9BB5;"></span> </div> <div id="manage-msg"></div> <div style="overflow-x:auto;"> <table> <thead><tr><th>Question</th><th>Module</th><th>Year</th><th>Answer</th><th>Bank</th><th>Status</th><th>Actions</th></tr></thead> <tbody id="q-table-body"><tr><td colspan="7" style="text-align:center;padding:20px;color:#8A9BB5;">Loading...</td></tr></tbody> </table> </div> <div id="pagination" style="padding:14px 20px;border-top:1px solid rgba(10,22,40,.05);display:flex;justify-content:space-between;align-items:center;"> <button onclick="prevPage()" style="padding:7px 14px;border-radius:8px;border:1.5px solid rgba(10,22,40,.1);background:white;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;">← Prev</button> <span id="page-info" style="font-size:12px;color:#8A9BB5;"></span> <button onclick="nextPage()" style="padding:7px 14px;border-radius:8px;border:1.5px solid rgba(10,22,40,.1);background:white;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;">Next →</button> </div> </div>`;
await loadQuestions();
}

async function loadQuestions(){
var res = await sb.from(‘questions’).select(’*’).order(‘created_at’, {ascending:false});
if(!res.error) allQuestions = res.data || [];
document.getElementById(‘q-count’).textContent = allQuestions.length + ’ total’;
currentPage = 0;
renderTable();
}

var filteredQ = [];
function filterQuestions(){
var search = document.getElementById(‘search-q’).value.toLowerCase();
var year = document.getElementById(‘filter-year’).value;
var bank = document.getElementById(‘filter-bank’).value;

filteredQ = allQuestions.filter(q=>{
var matchS = !search || q.question_text.toLowerCase().includes(search) || (q.module_name||’’).toLowerCase().includes(search);
var matchY = !year || q.year_level === year;
var matchB = !bank || q.bank === bank;
return matchS && matchY && matchB;
});
currentPage = 0;
renderTable(true);
}

function renderTable(filtered){
var data = filtered ? filteredQ : allQuestions;
var start = currentPage * pageSize;
var page = data.slice(start, start + pageSize);

document.getElementById(‘page-info’).textContent = ‘Page ‘+(currentPage+1)+’ of ‘+Math.ceil(data.length/pageSize)+’ (’+data.length+’ questions)’;

if(!page.length){
document.getElementById(‘q-table-body’).innerHTML=’<tr><td colspan="7" style="text-align:center;padding:20px;color:#8A9BB5;">No questions found</td></tr>’;
return;
}

document.getElementById(‘q-table-body’).innerHTML = page.map(q=>`<tr> <td style="max-width:280px;"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;">${q.question_text.substring(0,60)}...</div></td> <td style="font-size:11px;color:#8A9BB5;">${q.module_name||'—'}</td> <td><span class="badge badge-blue">Y${q.year_level||'?'}</span></td> <td><span style="background:#E2EDF8;color:#0D3B7A;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;">${(q.correct_option||'?').toUpperCase()}</span></td> <td><span class="badge ${q.bank==='nawa'?'badge-green':'badge-orange'}">${q.bank||'nawa'}</span></td> <td><span class="badge ${q.is_active?'badge-green':'badge-orange'}">${q.is_active?'Active':'Inactive'}</span></td> <td> <div style="display:flex;gap:6px;"> <button class="btn-edit" onclick="toggleActive('${q.id}',${q.is_active})">${q.is_active?'Deactivate':'Activate'}</button> <button class="btn-danger" onclick="deleteQuestion('${q.id}')">Delete</button> </div> </td> </tr>`).join(’’);
}

async function toggleActive(id, current){
await sb.from(‘questions’).update({is_active: !current}).eq(‘id’, id);
await loadQuestions();
}

async function deleteQuestion(id){
if(!confirm(‘Delete this question?’)) return;
await sb.from(‘questions’).delete().eq(‘id’, id);
var msg = document.getElementById(‘manage-msg’);
if(msg) msg.innerHTML=’<div class="msg-box msg-success" style="margin:10px 20px;">✅ Question deleted</div>’;
await loadQuestions();
}

function prevPage(){if(currentPage>0){currentPage–;renderTable(filteredQ.length?true:false);}}
function nextPage(){var data=filteredQ.length?filteredQ:allQuestions;if((currentPage+1)*pageSize<data.length){currentPage++;renderTable(filteredQ.length?true:false);}}
