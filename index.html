<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAWA Debug</title>
<style>
body{background:#0A1628;font-family:sans-serif;padding:20px;color:white}
.ok{color:#10B981;font-weight:700}
.err{color:#EF4444;font-weight:700}
.step{margin:10px 0;padding:12px;background:rgba(255,255,255,.05);border-radius:8px;font-size:14px}
button{padding:14px 32px;background:#4AA8E8;color:#0A1628;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin:8px}
</style>
</head>
<body>
<h2>NAWA Debug Test</h2>
<div id="log"></div>
<div style="margin-top:20px">
<button id="btn1">Test 1: Basic Click</button>
<button id="btn2">Test 2: Open Modal</button>
</div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center">
  <div style="background:white;border-radius:20px;padding:32px;max-width:400px;width:90%;text-align:center">
    <div style="font-size:20px;font-weight:800;color:#0A1628;margin-bottom:16px">Modal Works!</div>
    <button onclick="closeM()" style="padding:12px 24px;background:#0A1628;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">Close</button>
  </div>
</div>

<script>
var log = document.getElementById('log');

function addLog(msg, ok) {
  var d = document.createElement('div');
  d.className = 'step';
  d.innerHTML = '<span class="' + (ok ? 'ok' : 'err') + '">' + (ok ? '✓' : '✗') + '</span> ' + msg;
  log.appendChild(d);
}

// Test 1: JS runs
addLog('JavaScript is running', true);

// Test 2: getElementById works
var m = document.getElementById('modal');
addLog('getElementById works: ' + (m ? 'YES' : 'NO'), !!m);

// Test 3: classList works
try {
  m.classList.add('test');
  m.classList.remove('test');
  addLog('classList works: YES', true);
} catch(e) {
  addLog('classList ERROR: ' + e.message, false);
}

// Test 4: addEventListener works
var btn1 = document.getElementById('btn1');
var clicks = 0;
btn1.addEventListener('click', function() {
  clicks++;
  addLog('Button clicked! (count: ' + clicks + ')', true);
});

// Test 5: Modal open
function openM() {
  var modal = document.getElementById('modal');
  modal.style.display = 'flex';
  addLog('Modal opened!', true);
}
function closeM() {
  var modal = document.getElementById('modal');
  modal.style.display = 'none';
  addLog('Modal closed!', true);
}

document.getElementById('btn2').addEventListener('click', openM);

addLog('All listeners attached OK', true);
</script>

</body>
</html>
