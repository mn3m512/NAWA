<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawa — Medical Education</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1628;--sky:#4AA8E8;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--gray:#8A9BB5;--off:#F5F8FC;--foam:#E8F4FD;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--navy);color:var(--navy);}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;background:rgba(10,22,40,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.logo-text{font-size:18px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:white;}
.nav-btns{display:flex;gap:8px;}
.btn{padding:9px 20px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.2s;}
.btn-outline{background:transparent;color:white;border:1.5px solid rgba(255,255,255,.2);}
.btn-sky{background:var(--sky);color:var(--navy);}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px 40px;position:relative;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(74,168,232,.1) 0%,transparent 70%);}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(74,168,232,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(74,168,232,.04) 1px,transparent 1px);background-size:48px 48px;}
.hero-inner{position:relative;z-index:2;max-width:700px;}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(74,168,232,.1);border:1px solid rgba(74,168,232,.25);color:var(--sky);padding:7px 18px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:30px;}
h1{font-size:clamp(40px,7vw,76px);font-weight:900;color:white;line-height:1;letter-spacing:-3px;margin-bottom:20px;}
h1 span{color:var(--sky);}
.hero-sub{font-size:clamp(14px,2vw,17px);font-weight:300;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:36px;}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn-big{padding:14px 36px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:.2s;}
.btn-primary{background:var(--sky);color:var(--navy);}
.btn-secondary{background:rgba(255,255,255,.08);color:white;border:1px solid rgba(255,255,255,.15);}
.stats-row{display:flex;gap:clamp(24px,4vw,52px);justify-content:center;margin-top:52px;padding-top:36px;border-top:1px solid rgba(255,255,255,.07);flex-wrap:wrap;}
.stat-n{font-size:clamp(26px,3vw,36px);font-weight:900;color:white;letter-spacing:-1px;}
.stat-l{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-top:4px;}

/* SECTIONS */
.section{padding:80px clamp(20px,4vw,60px);}
.sec-tag{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--sky);margin-bottom:12px;text-align:center;}
.sec-title{font-size:clamp(28px,4vw,44px);font-weight:900;color:var(--navy);text-align:center;letter-spacing:-1px;margin-bottom:48px;}
.sec-title-white{color:white;}

/* FEATURES GRID */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:1100px;margin:0 auto;}
.feat{background:white;border-radius:16px;padding:26px;box-shadow:0 2px 16px rgba(10,22,40,.06);}
.feat-ico{font-size:28px;margin-bottom:14px;}
.feat-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:7px;}
.feat-desc{font-size:13px;font-weight:300;color:var(--gray);line-height:1.7;}
.pro-tag{font-size:9px;background:var(--sky);color:white;padding:2px 7px;border-radius:100px;font-weight:700;margin-left:5px;}

/* PRICING */
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;max-width:900px;margin:0 auto;}
.price-card{border-radius:20px;padding:32px;border:1px solid rgba(255,255,255,.08);position:relative;}
.price-popular{background:var(--sky);border-color:var(--sky);}
.pop-tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:white;color:var(--navy);font-size:10px;font-weight:800;padding:4px 14px;border-radius:100px;white-space:nowrap;}
.price-name{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:14px;}
.price-popular .price-name{color:rgba(10,22,40,.5);}
.price-amt{font-size:42px;font-weight:900;color:white;letter-spacing:-2px;line-height:1;}
.price-popular .price-amt{color:var(--navy);}
.price-per{font-size:12px;color:rgba(255,255,255,.3);margin-top:3px;}
.price-popular .price-per{color:rgba(10,22,40,.4);}
.price-line{height:1px;background:rgba(255,255,255,.1);margin:18px 0;}
.price-popular .price-line{background:rgba(10,22,40,.15);}
.price-feats{list-style:none;display:flex;flex-direction:column;gap:9px;margin-bottom:22px;}
.price-feats li{font-size:13px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;}
.price-popular .price-feats li{color:rgba(10,22,40,.7);}
.price-feats li::before{content:'✓';font-weight:800;color:var(--sky);font-size:12px;}
.price-popular .price-feats li::before{color:var(--navy);}
.price-btn{width:100%;padding:12px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:white;border:1.5px solid rgba(255,255,255,.2);}
.price-popular .price-btn{background:var(--navy);color:white;border:none;}

/* FOOTER */
footer{background:var(--navy);border-top:1px solid rgba(255,255,255,.06);padding:48px clamp(20px,4vw,60px);}
.footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:32px;margin-bottom:32px;}
.footer-brand{font-size:18px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:white;margin:10px 0 6px;}
.footer-tag{font-size:11px;color:rgba(255,255,255,.25);}
.footer-col h4{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:14px;}
.footer-col a{display:block;font-size:13px;font-weight:300;color:rgba(255,255,255,.45);text-decoration:none;margin-bottom:8px;}
.footer-bottom{padding-top:20px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.footer-copy{font-size:11px;color:rgba(255,255,255,.2);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,.8);z-index:500;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(12px);}
.overlay.open{display:flex;}
.modal{background:white;border-radius:24px;padding:32px;width:100%;max-width:500px;margin:auto;position:relative;}
.modal-x{position:absolute;top:14px;right:14px;background:var(--off);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--gray);}
.m-title{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.m-sub{font-size:13px;color:var(--gray);margin-bottom:22px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);display:block;margin-bottom:5px;}
.inp{width:100%;padding:11px 13px;border:1.5px solid rgba(10,22,40,.12);border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--navy);outline:none;margin-bottom:13px;}
.inp:focus{border-color:var(--sky);}
.sel{width:100%;padding:11px 13px;border:1.5px solid rgba(10,22,40,.12);border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--navy);outline:none;margin-bottom:13px;appearance:none;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.phone-row{display:flex;gap:8px;margin-bottom:13px;}
.phone-code{width:130px;padding:11px 10px;border:1.5px solid rgba(10,22,40,.12);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--navy);outline:none;appearance:none;flex-shrink:0;}
.phone-inp{flex:1;padding:11px 13px;border:1.5px solid rgba(10,22,40,.12);border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--navy);outline:none;}
.pw-wrap{position:relative;margin-bottom
