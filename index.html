<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nawa</title>
</head>
<body style="background:#0A1628;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:20px;font-family:sans-serif;margin:0;">
<h1 style="color:white;font-size:32px;">NAWA TEST</h1>
<button id="btn" style="padding:16px 40px;background:#4AA8E8;color:#0A1628;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;">Click Me</button>
<div id="msg" style="color:#10B981;font-size:16px;font-weight:600;">Waiting...</div>
<script>
var btn = document.getElementById('btn');
var msg = document.getElementById('msg');
msg.textContent = 'JS loaded OK';
btn.onclick = function() {
  msg.textContent = 'BUTTON WORKS! ' + new Date().toLocaleTimeString();
};
</script>
</body>
</html>
